services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    restart: unless-stopped

  scraper:
    build:
      context: .
      dockerfile: scrapers/Dockerfile
    env_file:
      - .env.local
    profiles:
      - tools
